<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSC SmartPrep BD</title>
  <meta name="description" content="বাংলাদেশের HSC শিক্ষার্থীদের MCQ, সৃজনশীল ও বোর্ড প্রশ্ন অনুশীলনের প্ল্যাটফর্ম।">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }
    header {
      background: #155e45;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; }
    main {
      max-width: 850px;
      margin: auto;
      padding: 16px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    button, select {
      font-size: 15px;
      padding: 11px 14px;
      border: 1px solid #d4dbe5;
      border-radius: 8px;
      cursor: pointer;
    }
    .tabs button {
      background: white;
      color: #155e45;
    }
    .tabs button.active {
      background: #155e45;
      color: white;
    }
    select {
      width: 100%;
      margin-bottom: 16px;
      background: white;
    }
    .card {
      background: white;
      border: 1px solid #e0e6ef;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px #00000008;
    }
    .card h3 { margin-top: 0; }
    .option {
      display: block;
      padding: 10px;
      margin: 8px 0;
      background: #f5f7fa;
      border-radius: 7px;
      cursor: pointer;
    }
    .option input { margin-right: 8px; }
    .answer {
      margin-top: 10px;
      color: #155e45;
      font-weight: bold;
    }
    .error {
      background: #fff0f0;
      color: #a11919;
      padding: 15px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    .muted { color: #687386; }
    footer {
      text-align: center;
      padding: 20px;
      color: #687386;
    }
  </style>
</head>

<body>
  <header>
    <h1>HSC SmartPrep BD</h1>
    <p>HSC প্রস্তুতি হোক আরও সহজ</p>
  </header>

  <main>
    <div class="tabs">
      <button class="active" data-tab="mcq">MCQ</button>
      <button data-tab="creative">সৃজনশীল</button>
      <button data-tab="board">বোর্ড প্রশ্ন</button>
    </div>

    <select id="subjectFilter">
      <option value="">সব বিষয়</option>
    </select>

    <div id="status" class="muted">প্রশ্ন লোড হচ্ছে...</div>
    <section id="questions"></section>
  </main>

  <footer>© HSC SmartPrep BD</footer>

  <script src="./questions.js?v=5"></script>

  <script>
  (() => {
    const status = document.getElementById("status");
    const output = document.getElementById("questions");
    const filter = document.getElementById("subjectFilter");
    const tabs = document.querySelectorAll("[data-tab]");

    let data;
    let currentTab = "mcq";

    function showError(message) {
      status.className = "error";
      status.textContent = message;
      output.replaceChildren();
    }

    function textValue(value) {
      if (value === null || value === undefined) return "";
      if (typeof value === "string" || typeof value === "number") {
        return String(value);
      }
      return "";
    }

    function safeText(parent, tag, value) {
      const element = document.createElement(tag);
      element.textContent = textValue(value);
      parent.appendChild(element);
      return element;
    }

    function getSubject(item) {
      return textValue(item && item.subject);
    }

    function getMCQs() {
      return Array.isArray(data.mcqQuestions)
        ? data.mcqQuestions : [];
    }

    function getBoardQuestions() {
      return Array.isArray(data.boardQuestions)
        ? data.boardQuestions : [];
    }

    function getCreativeQuestions() {
      if (Array.isArray(data.creativeQuestions)) {
        return data.creativeQuestions;
      }

      // Compatibility: detect creative questions in other arrays.
      const found = [];
      const seen = new Set();

      Object.keys(data).forEach(key => {
        if (!Array.isArray(data[key])) return;

        data[key].forEach(item => {
          if (
            item &&
            typeof item === "object" &&
            Array.isArray(item.questions) &&
            item.stimulus !== undefined &&
            !seen.has(item)
          ) {
            seen.add(item);
            found.push(item);
          }
        });
      });

      return found;
    }

    function addSubjects() {
      const subjects = Array.isArray(data.subjects)
        ? data.subjects : [];

      subjects.forEach(subject => {
        const value = typeof subject === "string"
          ? subject
          : textValue(subject && (
              subject.id || subject.name ||
              subject.subject || subject.title
            ));

        if (!value) return;

        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        filter.appendChild(option);
      });
    }

    function addOptions(card, item, index) {
      let options = item.options || item.choices || item.answers;

      if (!options || typeof options !== "object") {
        const keys = ["ক", "খ", "গ", "ঘ"];
        options = keys
          .map((key, i) => item[key] ?? item["option" + (i + 1)])
          .filter(value => value !== undefined);
      }

      if (Array.isArray(options)) {
        options.forEach((option, i) => {
          const label = document.createElement("label");
          label.className = "option";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "mcq-" + index;
          radio.value = String(i);

          label.appendChild(radio);
          label.appendChild(document.createTextNode(
            " " + (typeof option === "object"
              ? textValue(option.text || option.label || option.value)
              : textValue(option))
          ));
          card.appendChild(label);
        });
      } else {
        Object.keys(options).forEach(key => {
          const label = document.createElement("label");
          label.className = "option";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "mcq-" + index;
          radio.value = key;

          label.appendChild(radio);
          label.appendChild(document.createTextNode(
            " " + key + ". " + textValue(options[key])
          ));
          card.appendChild(label);
        });
      }

      const answer = item.answer ?? item.correctAnswer ??
        item.correctOption ?? item.correct;

      if (answer !== undefined) {
        const button = document.createElement("button");
        button.textContent = "উত্তর দেখুন";
        button.addEventListener("click", () => {
          let answerText = textValue(answer);

          if (Array.isArray(options)) {
            const numericAnswer = Number(answer);
            if (
              Number.isInteger(numericAnswer) &&
              numericAnswer >= 0 &&
              numericAnswer < options.length
            ) {
              answerText = textValue(options[numericAnswer]);
            }
          } else if (options && options[answer] !== undefined) {
            answerText = textValue(options[answer]);
          }

          let result = card.querySelector(".answer");
          if (!result) {
            result = document.createElement("p");
            result.className = "answer";
            card.appendChild(result);
          }
          result.textContent = "সঠিক উত্তর: " + answerText;
        });
        card.appendChild(button);
      }
    }

    function renderMCQ(items) {
      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "card";

        safeText(card, "h3",
          (index + 1) + ". " +
          (item.question || item.questionText || item.text || "প্রশ্ন")
        );

        if (item.chapter) {
          safeText(card, "p", "অধ্যায়: " + item.chapter);
        }

        addOptions(card, item, index);
        output.appendChild(card);
      });
    }

    function renderCreative(items) {
      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "card";

        safeText(card, "h3", "সৃজনশীল প্রশ্ন " + (index + 1));

        if (item.chapter) {
          safeText(card, "p", "অধ্যায়: " + item.chapter);
        }

        if (item.stimulus) {
          safeText(card, "p", item.stimulus);
        }

        if (Array.isArray(item.questions)) {
          item.questions.forEach((question, i) => {
            safeText(card, "p",
              ["ক", "খ", "গ", "ঘ"][i] + ". " +
              (typeof question === "object"
                ? textValue(question.question || question.text || question.title)
                : textValue(question))
            );
          });
        }

        output.appendChild(card);
      });
    }

    function renderBoard(items) {
      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "card";

        safeText(card, "h3",
          item.year ? "বোর্ড প্রশ্ন — " + item.year
                    : "বোর্ড প্রশ্ন " + (index + 1)
        );

        ["board", "subject", "chapter", "question", "text", "stimulus"]
          .forEach(key => {
            if (item[key] !== undefined) {
              safeText(card, "p",
                (key === "question" || key === "text" ||
                 key === "stimulus" ? "" : key + ": ") +
                textValue(item[key])
              );
            }
          });

        output.appendChild(card);
      });
    }

    function render() {
      output.replaceChildren();

      const allItems = currentTab === "mcq" ? getMCQs()
        : currentTab === "creative" ? getCreativeQuestions()
        : getBoardQuestions();

      const selectedSubject = filter.value;
      const items = selectedSubject
        ? allItems.filter(item => getSubject(item) === selectedSubject)
        : allItems;

      status.className = "muted";
      status.textContent = items.length
        ? "মোট " + items.length + "টি প্রশ্ন"
        : "এই বিভাগে প্রশ্ন পাওয়া যায়নি।";

      if (currentTab === "mcq") renderMCQ(items);
      else if (currentTab === "creative") renderCreative(items);
      else renderBoard(items);
    }

    try {
      data = window.HSC_SMARTPREP_DATA;

      if (!data || typeof data !== "object") {
        showError("প্রশ্নের ডেটা লোড হয়নি। questions.js ফাইল পরীক্ষা করুন।");
        return;
      }

      if (!Array.isArray(data.mcqQuestions)) {
        showError("mcqQuestions তালিকাটি পাওয়া যায়নি। questions.js-এর ডেটা কাঠামো পরীক্ষা করুন।");
        return;
      }

      addSubjects();

      tabs.forEach(button => {
        button.addEventListener("click", () => {
          currentTab = button.dataset.tab;
          tabs.forEach(tab => tab.classList.toggle("active", tab === button));
          render();
        });
      });

      filter.addEventListener("change", render);
      render();

    } catch (error) {
      console.error("SmartPrep error:", error);
      showError("প্রশ্ন দেখাতে সমস্যা হয়েছে। questions.js-এর ডেটা পরীক্ষা করুন।");
    }
  })();
  </script>
</body>
</html>
