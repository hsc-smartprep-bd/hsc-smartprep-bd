<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HSC SmartPrep BD — এইচএসসি ২০২৭-এর বাংলা MCQ, সৃজনশীল ও অনুশীলনী প্রশ্ন।">
  <title>HSC SmartPrep BD | এইচএসসি প্রস্তুতি</title>

  <style>
    :root {
      --blue: #164e8b;
      --bg: #f4f7fb;
      --ink: #172334;
      --muted: #5b6878;
      --line: #dbe3ee;
      --green: #177245;
      --red: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, "Noto Sans Bengali", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }

    header {
      background: linear-gradient(135deg, #123b6c, #2874b8);
      color: white;
      padding: 25px 16px;
    }

    header .wrap, main {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
    }

    header p {
      margin: 5px 0;
    }

    main {
      padding: 16px;
    }

    .panel, .question {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin: 14px 0;
      box-shadow: 0 2px 7px #17233408;
    }

    .tabs, .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    button, select, input {
      font: inherit;
      border: 1px solid #c8d3e0;
      border-radius: 10px;
      padding: 10px 12px;
    }

    button {
      cursor: pointer;
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    button.secondary {
      background: white;
      color: var(--blue);
    }

    .tabs button {
      flex: 1;
      min-width: 125px;
    }

    .controls select, .controls input {
      flex: 1;
      min-width: 140px;
      background: white;
      color: var(--ink);
    }

    .meta, .muted {
      color: var(--muted);
      font-size: .92rem;
    }

    .question h3 {
      margin: 8px 0 12px;
      font-size: 1.08rem;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0;
      background: #f8fafc;
      color: var(--ink);
      border-color: var(--line);
    }

    .option.correct {
      border: 2px solid var(--green);
      background: #edf9f1;
    }

    .option.wrong {
      border: 2px solid var(--red);
      background: #fff0ef;
    }

    .answer {
      margin-top: 12px;
      padding: 12px;
      background: #f0f6ff;
      border-radius: 9px;
    }

    .hidden {
      display: none;
    }

    .part {
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .pill {
      display: inline-block;
      background: #e8f1fb;
      color: var(--blue);
      border-radius: 99px;
      padding: 2px 9px;
      font-size: .8rem;
    }

    .empty {
      text-align: center;
      padding: 22px;
    }

    details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      color: var(--blue);
      font-weight: 600;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 22px;
      font-size: .9rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <h1>HSC SmartPrep BD</h1>
      <p>এইচএসসি ২০২৭ · বাংলা প্রশ্ন অনুশীলন</p>
      <p>MCQ · সৃজনশীল প্রশ্ন · বোর্ড প্রশ্ন</p>
    </div>
  </header>

  <main>
    <section class="panel">
      <strong>স্বাগতম!</strong>
      <p>বিষয় নির্বাচন করো, প্রশ্নের উত্তর দাও এবং নিজের প্রস্তুতি যাচাই করো।</p>
    </section>

    <div class="tabs">
      <button data-mode="mcq">MCQ অনুশীলন</button>
      <button class="secondary" data-mode="cq">সৃজনশীল প্রশ্ন</button>
      <button class="secondary" data-mode="board">বোর্ড প্রশ্ন</button>
    </div>

    <section class="panel">
      <div class="controls">
        <select id="subject">
          <option value="all">সব বিষয়</option>
        </select>

        <select id="chapter">
          <option value="all">সব অধ্যায়</option>
        </select>

        <input
          id="search"
          type="search"
          placeholder="প্রশ্ন খুঁজুন..."
          aria-label="প্রশ্ন খুঁজুন"
        >

        <button id="reset" class="secondary">রিসেট</button>
      </div>

      <p id="status" class="meta" aria-live="polite"></p>
    </section>

    <div id="app">
      <div class="panel">প্রশ্ন লোড হচ্ছে...</div>
    </div>
  </main>

  <footer>
    © HSC SmartPrep BD · শেখো, অনুশীলন করো, এগিয়ে যাও।
  </footer>

  <!-- প্রশ্নের ডেটা ফাইল -->
  <script src="./questions.js"></script>

  <script>
    (() => {
      "use strict";

      const data = window.HSC_SMARTPREP_DATA;

      const app = document.getElementById("app");
      const subjectSelect = document.getElementById("subject");
      const chapterSelect = document.getElementById("chapter");
      const searchInput = document.getElementById("search");
      const status = document.getElementById("status");
      const resetButton = document.getElementById("reset");

      let mode = "mcq";

      if (!data) {
        app.innerHTML = `
          <section class="panel">
            <h3>প্রশ্ন লোড হয়নি!</h3>
            <p>নিশ্চিত করো যে questions.js ফাইলটি index.html-এর একই ফোল্ডারে আছে।</p>
            <p>questions.js ফাইলে window.HSC_SMARTPREP_DATA নামে ডেটা থাকতে হবে।</p>
          </section>
        `;
        status.textContent = "প্রশ্নের ডেটা পাওয়া যায়নি।";
        return;
      }

      const subjects = data.subjects || [];
      const mcqs = data.mcqQuestions || [];
      const cqs = data.creativeQuestions || [];
      const boardQuestions = data.boardQuestions || [];

      // বিষয়ের তালিকা তৈরি
      subjects.forEach(item => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.name;
        subjectSelect.appendChild(option);
      });

      // HTML-এ নিরাপদে লেখা দেখানো
      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function subjectName(id) {
        const item = subjects.find(s => s.id === id);
        return item ? item.name : (id || "বিষয় উল্লেখ নেই");
      }

      function currentItems() {
        if (mode === "mcq") return mcqs;
        if (mode === "cq") return cqs;
        return boardQuestions;
      }

      function updateChapters() {
        const previous = chapterSelect.value;

        const chapters = [
          ...new Set(
            currentItems()
              .filter(q =>
                subjectSelect.value === "all" ||
                q.subject === subjectSelect.value
              )
              .map(q => q.chapter)
              .filter(Boolean)
          )
        ].sort();

        chapterSelect.innerHTML =
          '<option value="all">সব অধ্যায়</option>';

        chapters.forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          chapterSelect.appendChild(option);
        });

        if (chapters.includes(previous)) {
          chapterSelect.value = previous;
        }
      }

      function filteredItems() {
        const term = searchInput.value.trim().toLowerCase();

        return currentItems().filter(q => {
          const matchesSubject =
            subjectSelect.value === "all" ||
            q.subject === subjectSelect.value;

          const matchesChapter =
            chapterSelect.value === "all" ||
            q.chapter === chapterSelect.value;

          const searchable = [
            q.question,
            q.stimulus,
            q.prompt,
            q.chapter,
            q.board,
            ...(q.options || []),
            ...(q.questions || []).map(p => p.question)
          ].join(" ").toLowerCase();

          return matchesSubject &&
            matchesChapter &&
            (!term || searchable.includes(term));
        });
      }

      function renderMCQ(q, index) {
        const options = Array.isArray(q.options) ? q.options : [];

        return `
          <article class="question">
            <div class="meta">
              ${index + 1}. ${escapeHTML(subjectName(q.subject))}
              · ${escapeHTML(q.chapter || "অধ্যায় উল্লেখ নেই")}
            </div>

            <h3>${escapeHTML(q.question)}</h3>

            <div class="options">
              ${options.map((option, i) => `
                <button
                  type="button"
                  class="option"
                  data-index="${i}"
                  data-correct="${i === q.answer}"
                >
                  ${["ক", "খ", "গ", "ঘ"][i] || (i + 1)}.
                  ${escapeHTML(option)}
                </button>
              `).join("")}
            </div>

            <div class="answer hidden">
              <strong>সঠিক উত্তর:</strong>
              ${escapeHTML(options[q.answer] ?? "উত্তর দেওয়া নেই")}
              <br>
              <strong>ব্যাখ্যা:</strong>
              ${escapeHTML(q.explanation || "ব্যাখ্যা যোগ করা হয়নি।")}
            </div>
          </article>
        `;
      }

      function renderCQ(q, index) {
        const parts = q.questions || q.parts || [];

        return `
          <article class="question">
            <div class="meta">
              ${index + 1}. ${escapeHTML(subjectName(q.subject))}
              · ${escapeHTML(q.chapter || "অধ্যায় উল্লেখ নেই")}
              <span class="pill">সৃজনশীল</span>
            </div>

            <h3>উদ্দীপক</h3>
            <p>${escapeHTML(q.stimulus || q.prompt || "উদ্দীপক যোগ করা হয়নি।")}</p>

            ${parts.map(part => `
              <div class="part">
                <strong>
                  ${escapeHTML(part.part || part.label || "")}
                  (${escapeHTML(part.marks ?? "")} নম্বর)
                </strong>
                <p>${escapeHTML(part.question || "")}</p>
                ${part.answer ? `
                  <details>
                    <summary>উত্তর দেখো</summary>
                    <p>${escapeHTML(part.answer)}</p>
                  </details>
                ` : ""}
              </div>
            `).join("")}
          </article>
        `;
      }

      function renderBoard(q, index) {
        const answer = q.answerText || q.answer || "";

        return `
          <article class="question">
            <div class="meta">
              ${index + 1}. ${escapeHTML(subjectName(q.subject))}
              · ${escapeHTML(q.chapter || "অধ্যায় উল্লেখ নেই")}
            </div>

            <h3>${escapeHTML(q.question || q.prompt || "")}</h3>

            <p class="meta">
              ${escapeHTML(q.board || "অনুশীলন প্রশ্ন")}
              ${q.year ? " · " + escapeHTML(q.year) : ""}
            </p>

            ${q.options ? q.options.map((option, i) => `
              <p>${["ক", "খ", "গ", "ঘ"][i] || (i + 1)}.
                ${escapeHTML(option)}
              </p>
            `).join("") : ""}

            ${answer ? `
              <details>
                <summary>উত্তর দেখো</summary>
                <p>${escapeHTML(answer)}</p>
              </details>
            ` : ""}

            ${q.note ? `<p class="meta">${escapeHTML(q.note)}</p>` : ""}
          </article>
        `;
      }

      function render() {
        updateChapters();

        const items = filteredItems();

        const modeName = {
          mcq: "MCQ",
          cq: "সৃজনশীল প্রশ্ন",
          board: "বোর্ড/অনুশীলন প্রশ্ন"
        }[mode];

        status.textContent =
          `মোট ${items.length}টি ${modeName} পাওয়া গেছে।`;

        if (!items.length) {
          app.innerHTML = `
            <section class="panel empty">
              <h3>কোনো প্রশ্ন পাওয়া যায়নি</h3>
              <p>অন্য বিষয় নির্বাচন করো অথবা সার্চ বক্স খালি করে দেখো।</p>
            </section>
          `;
          return;
        }

        app.innerHTML = items.map((q, i) => {
          if (mode === "mcq") return renderMCQ(q, i);
          if (mode === "cq") return renderCQ(q, i);
          return renderBoard(q, i);
        }).join("");
      }

      // MCQ উত্তর নির্বাচন
      app.addEventListener("click", event => {
        const button = event.target.closest(".option");
        if (!button || !app.contains(button)) return;

        const card = button.closest(".question");
        if (!card || card.dataset.answered === "true") return;

        card.dataset.answered = "true";

        card.querySelectorAll(".option").forEach(option => {
          option.disabled = true;

          if (option.dataset.correct === "true") {
            option.classList.add("correct");
          }
        });

        if (button.dataset.correct !== "true") {
          button.classList.add("wrong");
        }

        const answer = card.querySelector(".answer");
        if (answer) answer.classList.remove("hidden");
      });

      // MCQ, সৃজনশীল ও বোর্ড প্রশ্নের ট্যাব
      document.querySelectorAll("[data-mode]").forEach(button => {
        button.addEventListener("click", () => {
          mode = button.dataset.mode;

          document.querySelectorAll("[data-mode]").forEach(tab => {
            tab.classList.toggle("secondary", tab !== button);
          });

          render();
        });
      });

      subjectSelect.addEventListener("change", render);
      chapterSelect.addEventListener("change", render);
      searchInput.addEventListener("input", render);

      resetButton.addEventListener("click", () => {
        subjectSelect.value = "all";
        chapterSelect.value = "all";
        searchInput.value = "";
        render();
      });

      render();
    })();
  </script>
</body>
</html>
