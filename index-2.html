<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSC SmartPrep BD — 100000 MCQ</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#182235;margin:0}header{background:#204e8a;color:white;padding:18px}main{max-width:850px;margin:auto;padding:14px}.controls{display:flex;gap:8px;flex-wrap:wrap}select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd5e1}button{cursor:pointer;background:#204e8a;color:white}.card{background:white;border:1px solid #dfe5ee;border-radius:12px;padding:14px;margin:12px 0}.option{display:block;width:100%;text-align:left;background:#f8fafc;color:#182235;margin-top:7px}.correct{border:2px solid green}.wrong{border:2px solid red}.note{font-size:14px;color:#566}</style></head><body>
<header><h1>HSC SmartPrep BD</h1>100,000 Practice MCQ Entries</header><main>
<p class="note">স্বচ্ছতা: ১০০,০০০টি entry বেস প্রশ্নের বিভিন্ন রূপ থেকে তৈরি; এগুলো ১০০,০০০টি সম্পূর্ণ আলাদা বা যাচাইকৃত বোর্ড প্রশ্ন নয়।</p>
<div class="controls"><select id="sub"><option value="All">সব বিষয়</option><option>Physics</option><option>Chemistry</option><option>Biology</option><option>Higher Math</option><option>ICT</option></select><input id="search" placeholder="প্রশ্ন খুঁজুন"><button id="quiz">২০ প্রশ্নের কুইজ</button></div>
<p id="status"></p><div id="app"></div></main>
<script>
const subjects=["Physics","Chemistry","Biology","Higher Math","ICT"];
const names={Physics:"পদার্থবিজ্ঞান",Chemistry:"রসায়ন",Biology:"জীববিজ্ঞান","Higher Math":"উচ্চতর গণিত",ICT:"ICT"};
const seed={
Physics:[["বেগের SI একক কোনটি?",["m/s","m/s²","N","J"],0],["ত্বরণের SI একক কোনটি?",["m/s²","m/s","kg","W"],0],["বল-এর SI একক কোনটি?",["N","J","W","Pa"],0],["কাজের SI একক কোনটি?",["J","N","W","C"],0],["ভরবেগের সূত্র কোনটি?",["p=mv","p=m/v","p=v/m","p=ma"],0]],
Chemistry:[["পানির রাসায়নিক সংকেত কোনটি?",["H₂O","CO₂","O₂","H₂"],0],["কার্বন ডাই-অক্সাইডের সংকেত কোনটি?",["CO₂","CO","C₂O","CaO"],0],["ইলেকট্রনের আধান কী?",["ঋণাত্মক","ধনাত্মক","নিরপেক্ষ","পরিবর্তনশীল"],0],["pH=7 হলে দ্রবণ কেমন?",["নিরপেক্ষ","অম্লীয়","ক্ষারীয়","ধাতব"],0],["সোডিয়ামের প্রতীক কোনটি?",["Na","S","So","Sd"],0]],
Biology:[["জীবদেহের মৌলিক একক কী?",["কোষ","টিস্যু","অঙ্গ","অঙ্গতন্ত্র"],0],["কোষের শক্তিঘর কোনটি?",["মাইটোকন্ড্রিয়া","রাইবোসোম","লাইসোসোম","গলজি বডি"],0],["সালোকসংশ্লেষণ কোথায় হয়?",["ক্লোরোপ্লাস্টে","মাইটোকন্ড্রিয়ায়","নিউক্লিয়াসে","রাইবোসোমে"],0],["প্রোটিন সংশ্লেষণের স্থান কোনটি?",["রাইবোসোম","লাইসোসোম","ভ্যাকুওল","সেন্ট্রিওল"],0],["মানুষের দেহকোষে ক্রোমোজোম কয়টি?",["46","23","44","48"],0]],
"Higher Math":[["দ্বিঘাত সমীকরণের সাধারণ রূপ কোনটি?",["ax²+bx+c=0","ax+b=0","ax³+bx=0","a/x+b=0"],0],["x²-এর অন্তরক কী?",["2x","x","2","x²"],0],["sin x-এর অন্তরক কী?",["cos x","-cos x","sin x","-sin x"],0],["cos x-এর অন্তরক কী?",["-sin x","sin x","cos x","-cos x"],0],["sin²x+cos²x এর মান কত?",["1","0","2","x"],0]],
ICT:[["CPU-এর পূর্ণরূপ কী?",["Central Processing Unit","Central Program Utility","Computer Processing User","Central Peripheral Unit"],0],["RAM কেমন মেমোরি?",["Volatile","Non-volatile","Optical","Magnetic tape"],0],["HTML-এর পূর্ণরূপ কী?",["HyperText Markup Language","HighText Machine Language","Hyperlink Transfer Markup Logic","Home Tool Markup Language"],0],["১ বাইটে কত বিট?",["8","4","16","2"],0],["Binary-তে কোন দুটি অঙ্ক?",["0 ও 1","1 ও 2","0 ও 9","2 ও 3"],0]]
};
const TOTAL=100000;
function getItem(id){let si=Math.floor(id/20000),s=subjects[si],list=seed[s],v=Math.floor(id/list.length),base=list[id%list.length],shift=v%4,o=base[1].slice(),opts=o.slice(shift).concat(o.slice(0,shift)),a=(base[2]-shift+4)%4;let prefixes=["","অনুশীলনী: ","রিভিশন: ","মডেল টেস্ট: ","HSC প্রস্তুতি: ","ধারণা যাচাই: ","প্র্যাকটিস সেট: ","দ্রুত যাচাই: "];return {id,s,q:prefixes[v%prefixes.length]+base[0],o:opts,a};}
function show(){let s=document.getElementById("sub").value,q=document.getElementById("search").value.toLowerCase().trim(),items=[];for(let i=0;i<TOTAL&&items.length<50;i++){let x=getItem(i);if((s==="All"||x.s===s)&&(!q||x.q.toLowerCase().includes(q)))items.push(x)}document.getElementById("status").textContent="মোট practice entry: 100,000 | এখানে দেখানো: "+items.length;document.getElementById("app").innerHTML=items.map((x,i)=>card(x,i+1)).join("")||"কোনো ফল পাওয়া যায়নি।";}
function card(x,n){return `<section class="card"><b>${n}. [${names[x.s]}] ${x.q}</b>${x.o.map((o,j)=>`<button class="option" data-c="${j===x.a}" onclick="pick(this)">${"ABCD"[j]}. ${o}</button>`).join("")}</section>`}
function pick(b){let p=b.parentElement;if(p.dataset.done)return;p.dataset.done="1";p.querySelectorAll("button").forEach(x=>{if(x.dataset.c==="true")x.classList.add("correct")});if(b.dataset.c!=="true")b.classList.add("wrong")}
function quiz(){let s=document.getElementById("sub").value,ids=[];for(let i=0;i<TOTAL;i++){if(s==="All"||subjects[Math.floor(i/20000)]===s)ids.push(i)}ids.sort(()=>Math.random()-.5);let items=ids.slice(0,20).map(getItem);document.getElementById("status").textContent="২০ প্রশ্নের কুইজ";document.getElementById("app").innerHTML=items.map(card).join("");}
document.getElementById("sub").onchange=show;document.getElementById("search").oninput=show;document.getElementById("quiz").onclick=quiz;show();
</script></body></html>
